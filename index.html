<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tiny star-catching game made for Richard." />
    <title>Hello Richard.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="planet planet-left"></span><span class="planet planet-right"></span>
      <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>
      <span class="spark s4">✦</span><span class="spark s5">✦</span><span class="spark s6">✦</span>
    </div>

    <main>
      <header>
        <h1>Hello <span>Richard.</span></h1>
        <p>One star. Zero pressure. Infinite glory.</p>
      </header>

      <section class="game" aria-labelledby="game-title">
        <div class="game-top">
          <h2 id="game-title">Catch the star!</h2>
          <p>Click it before it zips away.</p>
        </div>

        <div id="arena" class="arena" aria-label="Star catching game area">
          <button id="star" class="star" aria-label="Catch the star">★<span>•‿•</span></button>
        </div>

        <div class="game-bottom">
          <p class="score" aria-live="polite">Score <strong id="score">0</strong></p>
          <p id="message" class="message" aria-live="polite">Ready when you are, Richard.</p>
          <button id="reset" class="reset" type="button">Reset</button>
        </div>
      </section>
    </main>
    <script src="/game.js" defer></script>
  </body>
</html>
