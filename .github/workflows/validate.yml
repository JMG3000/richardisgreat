name: Validate

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTH_SECRET: github-actions-build-secret
      AUTH_GOOGLE_ID: build-placeholder
      AUTH_GOOGLE_SECRET: build-placeholder
      ACCOUNT_HASH_SECRET: github-actions-hash-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate score endpoint
        run: npm test
      - name: Build application
        run: npm run build
